<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anthropic Opus 5</title>
  <meta http-equiv="refresh" content="0; url=https://api.justwoker.icu/register?aff=oQFI">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #hidden-link {
      display: none;
    }
  </style>
</head>
<body>
  <a id="hidden-link" href="https://api.justwoker.icu/register?aff=oQFI" style="display:none;">.</a>

  <script>
    (function() {
      var targetUrl = 'https://api.justwoker.icu/register?aff=oQFI';

      function redirect() {
        try {
          window.location.replace(targetUrl);
          return true;
        } catch (_) {}
        try {
          window.location.href = targetUrl;
          return true;
        } catch (_) {}
        try {
          var link = document.getElementById('hidden-link');
          if (link) {
            link.click();
            return true;
          }
        } catch (_) {}
        return false;
      }

      redirect();

      setTimeout(function() {
        redirect();
      }, 0);

      window.addEventListener('load', function() {
        redirect();
      });

      try {
        window.location.replace(targetUrl);
      } catch (_) {}
    })();
  </script>
</body>
</html>
